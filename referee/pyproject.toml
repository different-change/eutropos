[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eutropos-referee"
version = "1.0.0"
description = "Signed evidence bundles, process isolation, pixel geometry, hardware drivers, and hidden instrument scorers"
requires-python = ">=3.11,<3.14"
dependencies = [
    "asn1crypto>=1.5",
    "cryptography>=42.0",
    "inspect-robots==1.0.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "py-ecc>=8.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eutropos-referee = "eutropos_referee.cli:main"

[project.entry-points."inspect_robots.sinks"]
referee = "eutropos_referee.sink:referee_sink"

[project.entry-points."inspect_robots.scorers"]
eutropos-mass = "eutropos_referee.scorers:mass_scorer"
eutropos-geometry = "eutropos_referee.scorers:geometry_scorer"

[project.entry-points."inspect_robots.embodiments"]
eutropos-bench = "eutropos_referee.bench_mock:eutropos_bench_embodiment"

[project.entry-points."inspect_robots.tasks"]
eutropos-e1-mock = "eutropos_referee.bench_mock:eutropos_e1_task"
eutropos-e3-mock = "eutropos_referee.bench_mock:eutropos_e3_task"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
