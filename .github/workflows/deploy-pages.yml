name: Deploy Static Product Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install referee & verify demo bundles before Pages deploy
        run: |
          python -m pip install --upgrade pip
          pip install -e "./referee[dev]"
          pytest referee/tests -q
          node deploy/test_web_verifier.mjs
          eutropos-referee verify --evidence-dir site/data/bundles/open_live --public-key site/data/bundles/open_live.trusted.pem --require-live-beacon --require-live-tsa
          eutropos-referee verify --evidence-dir site/data/bundles/hazard_live --public-key site/data/bundles/hazard_live.trusted.pem --require-live-beacon --require-live-tsa

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static web root
        run: |
          mkdir -p _site/pitch
          cp -r site/. _site/
          cp pitch/deck.html pitch/deck.css pitch/deck.js _site/pitch/
          touch _site/.nojekyll
          python3 -c '
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          root = Path("_site").resolve()
          sec = root / ".well-known" / "security.txt"
          assert sec.is_file(), f"Missing {sec}"
          for name in ("index.html", "verify.html", "a4-study.html", "rig.html"):
              p = root / name
              p.write_text(p.read_text().replace("../pitch/deck.html", "pitch/deck.html"))
          for name in ("deck.html", "deck.css", "deck.js"):
              p = root / "pitch" / name
              p.write_text(p.read_text().replace("../site/", "../"))
          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k in ("href", "src") and v:
                          self.refs.append(v)
          html_files = [root / n for n in ("index.html", "verify.html", "a4-study.html", "rig.html", "404.html")] + [root / "pitch" / "deck.html"]
          for hf in html_files:
              lp = LinkParser()
              lp.feed(hf.read_text())
              for raw_ref in lp.refs:
                  ref = raw_ref.split("#", 1)[0].split("?", 1)[0]
                  if not ref or ref.startswith(("http://", "https://", "mailto:", "data:")):
                      continue
                  if ref == "/eutropos/":
                      target = root / "index.html"
                  elif ref.startswith("/eutropos/"):
                      target = root / ref[len("/eutropos/"):]
                  elif ref.startswith("/"):
                      raise AssertionError(f"Unexpected root path {raw_ref!r} in {hf}")
                  else:
                      target = (hf.parent / ref).resolve()
                  assert target.exists(), f"Broken local link {raw_ref!r} in {hf} -> {target}"
          url_re = re.compile(r"url\(([^)]+)\)")
          for css in root.rglob("*.css"):
              txt = css.read_text()
              for m in url_re.finditer(txt):
                  u = m.group(1).strip().strip(chr(34) + chr(39)).split("#", 1)[0].split("?", 1)[0]
                  if not u or u.startswith(("http://", "https://", "data:")):
                      continue
                  target = (root / u[len("/eutropos/"):]) if u.startswith("/eutropos/") else (css.parent / u).resolve()
                  assert target.exists(), f"Broken CSS url {u!r} in {css} -> {target}"
          print("PAGES_LINK_CHECK_PASSED")
          '
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [verify, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
