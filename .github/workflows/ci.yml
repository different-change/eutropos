name: Eutropos CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install package and dev test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./referee[dev]"
      - name: Verify release version consistency
        run: |
          python - <<'PY'
          import json, re, tomllib
          from pathlib import Path
          py_ver = tomllib.loads(Path("referee/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_txt = Path("referee/src/eutropos_referee/__init__.py").read_text(encoding="utf-8")
          m_init = re.search(r'__version__\s*=\s*"([^"]+)"', init_txt)
          brand_txt = Path("site/js/brand-config.js").read_text(encoding="utf-8")
          m_brand = re.search(r'VERSION:\s*"([^"]+)"', brand_txt)
          cit_txt = Path("CITATION.cff").read_text(encoding="utf-8")
          m_cit = re.search(r'^version:\s*"([^"]+)"', cit_txt, re.M)
          versions = [py_ver, m_init.group(1), m_brand.group(1), m_cit.group(1)]
          assert len(set(versions)) == 1, f"Version mismatch: {versions}"
          print(f"VERSION_CONSISTENCY_OK={py_ver}")
          PY
      - name: Run Python test suite
        run: pytest referee/tests -q
      - name: Run Web Crypto verifier tests
        run: node deploy/test_web_verifier.mjs
      - name: Run README quickstart smoke checks & report CSP/badge check
        run: |
          eutropos-referee --version
          eutropos-referee verify --evidence-dir site/data/bundles/open_live --public-key site/data/bundles/open_live.trusted.pem --require-live-beacon --require-live-tsa
          eutropos-referee verify --evidence-dir site/data/bundles/hazard_live --public-key site/data/bundles/hazard_live.trusted.pem --require-live-beacon --require-live-tsa
          eutropos-referee render-report --evidence-dir site/data/bundles/open_live --public-key site/data/bundles/open_live.trusted.pem --require-live-beacon --require-live-tsa --out /tmp/audit_report.html
          test -s /tmp/audit_report.html
          grep -q "VERIFIED PASS (LIVE CRYPTO)" /tmp/audit_report.html
          grep -q "font-src data:" /tmp/audit_report.html
          python -c "from pathlib import Path; html = Path('/tmp/audit_report.html').read_text(encoding='utf-8'); assert 'unsafe-inline' not in html"
