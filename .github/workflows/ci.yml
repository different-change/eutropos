name: Habilis CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install package and dev test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./referee[dev]" || pip install -e ./referee pytest
      - name: Run Python test suite
        run: pytest referee/tests -q
      - name: Run Web Crypto verifier tests
        run: node deploy/test_web_verifier.mjs
