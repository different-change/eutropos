  <line x1="36" y1="88" x2="216" y2="88" stroke="#DCD5C7" stroke-width="1"/>
  <text x="36" y="110" fill="#14171D" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Future drand-quicknet round</text>
