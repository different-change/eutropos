<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Eutropos architecture diagram: Sealed Draw, Unassisted Two-Arm Rig, Process Containment Boundary, Hidden Physical Referee Bench, and Offline Certificate">
