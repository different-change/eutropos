<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-labelledby="schematic-title schematic-desc">
  <title id="schematic-title">Eutropos Architecture: Blind to the Athlete, Legible to the Judge</title>
  <desc id="schematic-desc">Four-stage execution and verification architecture showing Stage 01 Sealed Draw, Stage 02 Unassisted Two-Arm Athlete separated by a dashed Blindness Boundary from Stage 03 Hidden Referee Bench metrology, flowing into Stage 04 Offline Certificate.</desc>

  <defs>
    <marker id="arrow-bronze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#9C7A3C"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#14233C"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1120" height="300" fill="#FAF8F4"/>

  <!-- STAGE 01: SEALED DRAW -->
  <rect x="20" y="22" width="212" height="256" fill="#EAE5D9" stroke="#DCD5C7" stroke-width="1"/>
  <rect x="20" y="22" width="212" height="4" fill="#9C7A3C"/>
  <text x="36" y="48" fill="#9C7A3C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">01 · SEALED DRAW</text>
  <text x="36" y="74" fill="#14171D" font-family="'EB Garamond', Georgia, serif" font-size="22" font-weight="400">Public Randomness</text>

  <line x1="36" y1="88" x2="216" y2="88" stroke="#DCD5C7" stroke-width="1"/>
  <text x="36" y="110" fill="#14171D" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Future drand-quicknet round</text>
  <text x="36" y="130" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">Selects physical parameters</text>
  <text x="36" y="148" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">right before execution.</text>

  <text x="36" y="180" fill="#14171D" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Append-Only SlotLedger</text>
  <text x="36" y="200" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">Every attempt pre-registered;</text>
  <text x="36" y="218" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">preserves full denominators.</text>

  <rect x="36" y="236" width="180" height="26" fill="#FAF8F4" stroke="#9C7A3C" stroke-width="1"/>
  <text x="126" y="253" text-anchor="middle" fill="#14233C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Zero Cherry-Picking</text>

  <!-- Arrow 01 -> 02 -->
  <line x1="232" y1="76" x2="262" y2="76" stroke="#9C7A3C" stroke-width="1.5" marker-end="url(#arrow-bronze)"/>

  <!-- STAGE 02: UNASSISTED ATHLETE (ABOVE BLINDNESS BOUNDARY) -->
  <rect x="266" y="22" width="566" height="106" fill="#FAF8F4" stroke="#14233C" stroke-width="1.3"/>
  <rect x="266" y="22" width="5" height="106" fill="#14233C"/>
  <text x="284" y="45" fill="#9C7A3C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">02 · UNASSISTED ATHLETE (MODEL OBSERVES ONLY THIS ZONE)</text>
  <text x="284" y="70" fill="#14171D" font-family="'EB Garamond', Georgia, serif" font-size="21" font-weight="400">Early-Human Body · Zero Wrist Cams, Depth Maps, or Markers</text>

  <!-- Three compact capability chips inside 02 -->
  <rect x="284" y="84" width="170" height="30" fill="#EAE5D9" stroke="#DCD5C7" stroke-width="1"/>
  <text x="369" y="103" text-anchor="middle" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600">2 Arms · 5-Finger Hands</text>

  <rect x="466" y="84" width="170" height="30" fill="#EAE5D9" stroke="#DCD5C7" stroke-width="1"/>
  <text x="551" y="103" text-anchor="middle" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600">Head Stereo + Plain Text</text>

  <rect x="648" y="84" width="168" height="30" fill="#EAE5D9" stroke="#DCD5C7" stroke-width="1"/>
  <text x="732" y="103" text-anchor="middle" fill="#14233C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600">Bare Table · Raw Vision</text>

  <!-- BLINDNESS BOUNDARY LINE & BADGE -->
  <line x1="258" y1="149" x2="840" y2="149" stroke="#9C7A3C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="348" y="137" width="324" height="24" fill="#FAF8F4" stroke="#9C7A3C" stroke-width="1"/>
  <text x="510" y="153" text-anchor="middle" fill="#9C7A3C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.2">BLINDNESS BOUNDARY · OS PROCESS SANDBOX</text>

  <!-- Vertical Physical Outcome Connector 02 -> 03 (clear of badge) -->
  <line x1="760" y1="128" x2="760" y2="164" stroke="#14233C" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
  <rect x="692" y="138" width="136" height="22" fill="#FAF8F4" stroke="#14233C" stroke-width="1"/>
  <text x="760" y="153" text-anchor="middle" fill="#14233C" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="600">Physical Contact</text>

  <!-- STAGE 03: HIDDEN REFEREE BENCH (BELOW BLINDNESS BOUNDARY) -->
  <rect x="266" y="168" width="566" height="110" fill="#14233C" stroke="#0D1829" stroke-width="1.3"/>
  <text x="284" y="191" fill="#C8AA74" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">03 · HIDDEN REFEREE BENCH (LEGIBLE ONLY TO JUDGE)</text>
  <text x="284" y="216" fill="#F5F2EB" font-family="'EB Garamond', Georgia, serif" font-size="21" font-weight="400">Concealed Physical Instrumentation Grades Reality Directly</text>

  <!-- Three concealed instrument panels inside 03 -->
  <rect x="284" y="229" width="170" height="36" fill="#1D2F4D" stroke="#9C7A3C" stroke-width="1"/>
  <text x="369" y="244" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Balance (CBCP-01)</text>
  <text x="369" y="258" text-anchor="middle" fill="#D7C299" font-family="'Inter', sans-serif" font-size="10">Settled mass readout</text>

  <rect x="466" y="229" width="170" height="36" fill="#1D2F4D" stroke="#9C7A3C" stroke-width="1"/>
  <text x="551" y="244" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Overhead Camera</text>
  <text x="551" y="258" text-anchor="middle" fill="#D7C299" font-family="'Inter', sans-serif" font-size="10">&lt;= 0.5 mm planar drift</text>

  <rect x="648" y="229" width="168" height="36" fill="#1D2F4D" stroke="#9C7A3C" stroke-width="1"/>
  <text x="732" y="244" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Depth Switch</text>
  <text x="732" y="258" text-anchor="middle" fill="#D7C299" font-family="'Inter', sans-serif" font-size="10">Binary physical seating</text>

  <!-- Arrow 03 -> 04 -->
  <line x1="832" y1="223" x2="862" y2="223" stroke="#9C7A3C" stroke-width="1.5" marker-end="url(#arrow-bronze)"/>

  <!-- STAGE 04: OFFLINE CERTIFICATE -->
  <rect x="866" y="22" width="234" height="256" fill="#FAF8F4" stroke="#B7D3C9" stroke-width="1.2"/>
  <rect x="866" y="22" width="234" height="4" fill="#1F5E4B"/>
  <text x="882" y="48" fill="#1F5E4B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">04 · CERTIFICATE</text>
  <text x="882" y="74" fill="#14171D" font-family="'EB Garamond', Georgia, serif" font-size="22" font-weight="400">Offline Audit Proof</text>

  <line x1="882" y1="88" x2="1084" y2="88" stroke="#DCD5C7" stroke-width="1"/>
  <text x="882" y="112" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">Ed25519 DSSE Signature</text>
  <text x="882" y="138" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">FreeTSA RFC 3161 Tokens</text>
  <text x="882" y="164" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">SHA-256 Manifest Chain</text>
  <text x="882" y="196" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">Verifies offline in any browser</text>
  <text x="882" y="214" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">via native Web Crypto API.</text>

  <rect x="882" y="236" width="202" height="26" fill="#EAF2EF" stroke="#B7D3C9" stroke-width="1"/>
  <text x="983" y="253" text-anchor="middle" fill="#1F5E4B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Open Track B · Escrow C</text>
</svg>
