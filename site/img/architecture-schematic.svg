  <text x="882" y="48" fill="#1F5E4B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">04 &middot; CERTIFICATE</text>
  <text x="882" y="74" fill="#14171D" font-family="'EB Garamond', Georgia, serif" font-size="22" font-weight="400">Client-Side Proof</text>

  <line x1="882" y1="88" x2="1084" y2="88" stroke="#DCD5C7" stroke-width="1"/>
  <text x="882" y="112" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">Ed25519 DSSE Signature</text>
  <text x="882" y="138" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">FreeTSA RFC 3161 Tokens</text>
  <text x="882" y="164" fill="#14171D" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600">SHA-256 Manifest Chain</text>
  <text x="882" y="196" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">Zero-server verification via</text>
  <text x="882" y="214" fill="#5A606A" font-family="'Inter', sans-serif" font-size="11.5">native browser Web Crypto.</text>

  <rect x="882" y="236" width="202" height="26" fill="#EAF2EF" stroke="#B7D3C9" stroke-width="1"/>
  <text x="983" y="253" text-anchor="middle" fill="#1F5E4B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600">Track B &middot; Escrow Track C</text>
