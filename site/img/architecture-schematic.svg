  <rect x="0" y="0" width="1120" height="300" fill="#FAF8F4"/>

  <!-- STAGE 01 -->
  <rect x="20" y="22" width="212" height="256" fill="#EAE5D9" stroke="#DCD5C7" stroke-width="1"/>
