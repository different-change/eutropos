  <text x="284" y="45" fill="#795B2B" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="1.4">02 &middot; UNASSISTED ATHLETE (MODEL OBSERVES ONLY THIS ZONE)</text>
